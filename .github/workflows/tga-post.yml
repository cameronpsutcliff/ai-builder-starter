name: TGA daily post

on:
  schedule:
    # 22:00 UTC daily (about 5pm US Eastern / 2pm Pacific). Edit to taste.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = verify token and image URLs only; dry-run = preview; post = publish next post'
        type: choice
        options: [check, dry-run, post]
        default: check

permissions:
  contents: write

# Never run two posting jobs at once.
concurrency:
  group: tga-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish next post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          case "${{ github.event.inputs.mode || 'post' }}" in
            check)   node tga/publish.mjs --check ;;
            dry-run) node tga/publish.mjs --dry-run ;;
            *)       node tga/publish.mjs ;;
          esac

      - name: Save posting history
        run: |
          if [ -n "$(git status --porcelain tga/state.json)" ]; then
            git config user.name "tga-bot"
            git config user.email "tga-bot@users.noreply.github.com"
            git add tga/state.json
            git commit -m "tga: record published post [skip ci]"
            git pull --rebase
            git push
          fi
